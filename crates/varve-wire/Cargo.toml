[package]
name = "varve-wire"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
varve-core = { path = "../varve-core" }
varve-schema = { path = "../varve-schema" }
varve-value = { path = "../varve-value" }
varve-record = { path = "../varve-record" }
thiserror.workspace = true
# The wire is JSON: serde_json is the format parser here (§9 — wire types
# only). Emitted lines are JCS canonical bytes from varve-core, so the
# writer never depends on serde_json's output shape.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Only for the Deserialize visitor that parses JSON straight into a
# CanonicalValue and refuses duplicate object keys (§5 reader).
serde = "1"

[features]
# Deterministic salts for tests and examples — never in production
# (§2.13 decision 5: salts are random inputs from Tier 5).
test-util = []

[dev-dependencies]
proptest.workspace = true
varve-wire = { path = ".", features = ["test-util"] }
