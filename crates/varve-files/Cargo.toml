[package]
name = "varve-files"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
varve-core = { path = "../varve-core" }
age = { version = "0.12", features = ["async"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["compat", "io-util"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros"] }
tempfile = "3"
