[package]
name = "varve-bundle"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# Tier 5 (§7, §13.6): the export bundle — the exporter/importer that
# joins what the deterministic crates deliberately keep apart. It pairs
# a wire stream with its blob sidecar (`varve-wire` owns descriptions,
# `varve-files` streams bytes) and surfaces with their wire envelope
# (`varve-surface` owns the body codec, `varve-wire` the envelope).
# Neither joined crate grows the other's half — this crate is the join.
[dependencies]
varve-core = { path = "../varve-core" }
varve-record = { path = "../varve-record" }
varve-surface = { path = "../varve-surface" }
varve-wire = { path = "../varve-wire" }
varve-files = { path = "../varve-files" }
thiserror.workspace = true
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "macros"] }
varve-schema = { path = "../varve-schema" }
varve-logic = { path = "../varve-logic" }
varve-value = { path = "../varve-value" }
varve-wire = { path = "../varve-wire", features = ["test-util"] }
