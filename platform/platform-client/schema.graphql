"""
The schema as a flat list.
"""
type DraftSchema {
	"""
	Every element, **document order** (a group precedes its
	children; siblings in their order), each naming its parent.
	"""
	elements: [SchemaElement!]!
}

"""
One option; identity is the `id` (DESIGN §2.11).
"""
type EnumOption {
	id: ID!
	label: String!
