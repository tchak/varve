	type: ColumnTypeInput!
	"""
	Omitted = required for an effectively public column, optional
	for a reviewer-only one (G.7 *Required on columns*).
	"""
	required: Boolean
	"""
	Clamped to the parent's effective audience (P.4).
	"""
	audience: Audience! = ALL
}

