type Procedure {
	id: ID!
	title: String!
	"""
	Free text; empty when none.
	"""
	description: String!
	createdAt: DateTime!
	updatedAt: DateTime!
	"""
	The lifecycle state (G.2 rule 5): a union of state-specific
	objects — facts live where they are meaningful, no nullable
	`since`.
	"""
	state: ProcedureState!
	"""
	The audit trail (G.9), oldest first: lifecycle transitions
	only, never authoring workflow — bounded by design.
	"""
	events: [ProcedureEvent!]!
	"""
	The owning organization.
	"""
	organization: OrganizationRef!
	"""
	The draft of the next revision; `null` when none is in
	progress.
	"""
	revisionDraft: RevisionDraft
}

"""
Closed to new submissions.
"""
type ProcedureClosedState {
	"""
	Since when the procedure is closed.
	"""
	since: DateTime!
}

"""
Never published. Its only fact is the row's creation time.
"""
type ProcedureDraftState {
	createdAt: DateTime!
}

type ProcedureEvent {
	"""
	Time-ordered (UUID v7): the log's sequence as well as its id.
	"""
	id: ID!
	"""
	What happened.
	"""
	kind: ProcedureEventKind!
	"""
	Who acted; `null` for a system event — or an account since
	deleted.
	"""
	actor: AccountRef
	"""
	When it happened.
	"""
	createdAt: DateTime!
}

"""
The event alphabet (platform P.4), generated from the
platform-core enum. `PUBLISHED` has no writer until the kernel
edge lands.
"""
enum ProcedureEventKind {
	CREATED
	PUBLISHED
	CLOSED
	REOPENED
}

"""
Open for submissions.
"""
type ProcedurePublishedState {
	"""
	Since when the procedure is open — reset by reopening, so
	deliberately not `publishedAt`; revision publication dates
	live on revisions (platform P.4).
	"""
	since: DateTime!
}

type ProcedureRef {
	id: ID!
	title: String!
	"""
	The bare lifecycle state.
	"""
	state: ProcedureStateValue!
	organization: OrganizationRef!
}

"""
The lifecycle state (G.2 rule 5): a union of state-specific
objects, subject-prefixed.
"""
union ProcedureState = ProcedureDraftState | ProcedurePublishedState | ProcedureClosedState

"""
The bare state, for list rows and filters (G.2 rule 5's parallel
enum, generated from the platform-core discriminant).
"""
enum ProcedureStateValue {
	DRAFT
	PUBLISHED
	CLOSED
}

