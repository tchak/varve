	REQUIREDNESS_TIGHTENED
	REQUIREDNESS_LOOSENED
	REQUIREDNESS_CHANGED
	VISIBILITY_CHANGED
	FORMAT_TIGHTENED
	FORMAT_LOOSENED
	FORMAT_CHANGED
