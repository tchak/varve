"""
`moveElement` input.
"""
input MoveElementInput {
	procedureId: ID!
	"""
	Any element (a group or section with its subtree).
	"""
	id: ID!
	placement: PlacementInput!
}

type Mutation {
	"""
	Creates an organization; the viewer becomes its first member.
	"""
	createOrganization(input: CreateOrganizationInput!): Organization!
	"""
	Creates a team in an organization the viewer is a member of.
	"""
	createTeam(input: CreateTeamInput!): Team!
	"""
	Creates a procedure owned by an organization the viewer is a
	member of.
	"""
	createProcedure(input: CreateProcedureInput!): Procedure!
	"""
	Adds a column to the procedure's revision draft (starting the
	draft when none is in progress). The new column is the element
	in front of `placement.beforeId` in its parent — or the parent's
	last child when `beforeId` is omitted.
	"""
	addColumn(input: AddColumnInput!): Procedure!
	"""
	Adds an empty group to the procedure's revision draft; placed
	like `addColumn`.
	"""
	addGroup(input: AddGroupInput!): Procedure!
	"""
	Adds an empty section to the procedure's revision draft;
	placed like `addColumn`. Its id is a kernel `NodeId` (DESIGN
	§2.6, surface node identity).
	"""
	addSection(input: AddSectionInput!): Procedure!
	"""
	Adds a note to the procedure's revision draft; placed like
	`addColumn`. A `REVIEWER` note is guidance for instructors.
	"""
	addNote(input: AddNoteInput!): Procedure!
	"""
	Changes a column's label, type (the type carries whether it
	holds many values) or audience; its id — its identity for the
	impact report — never changes.
	"""
	updateColumn(input: UpdateColumnInput!): Procedure!
	"""
	Changes a group's label, cardinality or audience; its id and
	children stay.
	"""
	updateGroup(input: UpdateGroupInput!): Procedure!
	"""
	Changes a section's title, help or audience; its id and
	children stay.
	"""
	updateSection(input: UpdateSectionInput!): Procedure!
	"""
	Changes a note's title, body or audience; its id stays.
	"""
	updateNote(input: UpdateNoteInput!): Procedure!
	"""
	Moves an element (a group or section with its subtree) to
	`placement`.
	"""
	moveElement(input: MoveElementInput!): Procedure!
	"""
	Removes an element (a group or section with its subtree) from
	the draft.
	"""
	removeElement(input: RemoveElementInput!): Procedure!
	"""
	Drops the procedure's revision draft; `revisionDraft` is `null`
	afterwards.
	"""
	discardRevisionDraft(input: DiscardRevisionDraftInput!): Procedure!
}

"""
An explication: prose, no data. A `REVIEWER` note is authored
guidance for instructors.
"""
type Note {
	id: ID!
	"""
	The containing group or section; `null` at the root.
	"""
	parentId: ID
	"""
	Heading; `null` when none.
	"""
	title: String
	body: String!
	audience: Audience!
}

"""
`INTEGER` / `DECIMAL`: an optional unit (DESIGN §2.14).
"""
input NumberTypeInput {
	unit: Unit
}

type Organization {
	id: ID!
	"""
	URL/API handle, unique across the platform.
	"""
	slug: Slug!
	name: String!
	createdAt: DateTime!
	updatedAt: DateTime!
	"""
	The organization's teams, oldest first (bounded, G.2.4).
	"""
	teams: [TeamRef!]!
	"""
	The procedures the organization owns, oldest first.
	"""
	procedures: [ProcedureRef!]!
	"""
	The members — every one administers every procedure the
	organization owns (P.4).
	"""
	members: [Member!]!
	"""
	Counts without fetching the lists (G.2.6).
	"""
	counts: OrganizationCounts!
}

"""
`organization.counts`.
"""
type OrganizationCounts {
	procedures: Int!
	teams: Int!
	members: Int!
}

type OrganizationRef {
	id: ID!
	slug: Slug!
	name: String!
}

type PhoneFormat {
	kind: TextFormatKind!
}

"""
Where to put an element: `parentId` names a group or a section
(`null` = root), `beforeId` a sibling to insert in front of
(`null` = append).
"""
input PlacementInput {
	parentId: ID
	beforeId: ID
}

type Procedure {
	id: ID!
	title: String!
	"""
	Free text; empty when none.
	"""
	description: String!
	createdAt: DateTime!
	updatedAt: DateTime!
	"""
	The owning organization.
	"""
	organization: OrganizationRef!
	"""
	The draft of the next revision; `null` when none is in
	progress.
	"""
	revisionDraft: RevisionDraft
}

type ProcedureRef {
	id: ID!
	title: String!
	organization: OrganizationRef!
}

type Query {
	"""
	The authenticated account the request executes as.
	"""
	viewer: Viewer!
	"""
	An organization the viewer is a member of; `null` otherwise.
	"""
	organization(id: ID!): Organization
	"""
	The organizations the viewer is a member of, oldest first.
	"""
	organizations: [OrganizationRef!]!
	"""
	A team of an organization the viewer is a member of, or a team
	the viewer reviews for; `null` otherwise.
	"""
	team(id: ID!): Team
	"""
	A procedure owned by an organization the viewer is a member
	of; `null` otherwise.
	"""
	procedure(id: ID!): Procedure
	"""
	Every procedure the viewer administers — those owned by the
	viewer's organizations — oldest first.
	"""
	procedures: [ProcedureRef!]!
}

"""
An author-supplied pattern, run full-match on the linear-time
engine (no backtracking — DESIGN §2.6).
"""
type RegexFormat {
	kind: TextFormatKind!
	pattern: String!
}

"""
`REGEX`: the pattern, verified on the linear-time engine at edit
time.
"""
input RegexFormatInput {
	pattern: String!
}

