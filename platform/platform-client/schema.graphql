}

"""
A column, a group, a section or a note.
"""
union Element = Column | Group | Section | Note

type EmailFormat {
	kind: TextFormatKind!
}

"""
One option; identity is the `id` (DESIGN §2.11).
"""
type EnumOption {
	id: ID!
	label: String!
