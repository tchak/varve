	`since`.
	"""
	state: ProcedureState!
	"""
	The audit trail (G.9), oldest first: lifecycle transitions
	only, never authoring workflow — bounded by design.
	"""
	events: [ProcedureEvent!]!
	"""
	One trail entry (G.11.6) — the diff page's point lookup, so
	reading one publication's `report` never computes the others'.
	`null` for an id that is not this procedure's.
	"""
	event(id: ID!): ProcedureEvent
	"""
	The owning organization.
	"""
	organization: OrganizationRef!
	"""
	All the procedure's case files, newest first, forward-only —
	the unbounded list, a connection (G.2.4, G.13). Reaching this
	object already required administering the procedure.
	"""
	caseFiles(first: Int, after: String): CaseFileConnection!
	"""
	The draft of the next revision — *head until touched* (G.7
	virtual draft): the stored working buffer when one is in
	progress, otherwise the published head's tree (`base` naming
	the head), otherwise the empty tree. `inProgress` carries
	which; the first edit forks exactly this shape.
	"""
	revisionDraft: RevisionDraft!
}

type ProcedureClosedEvent implements ProcedureEvent {
	"""
	Time-ordered (UUID v7): the log's sequence as well as
	its id.
	"""
	id: ID!
	"""
	What happened.
	"""
	kind: ProcedureEventKind!
	"""
	Who acted; `null` for a system event — or an account
	since deleted.
	"""
	actor: AccountRef
	"""
	When it happened.
	"""
	createdAt: DateTime!
}

"""
Closed to new submissions.
"""
type ProcedureClosedState {
	"""
	Since when the procedure is closed.
	"""
	since: DateTime!
}

type ProcedureCreatedEvent implements ProcedureEvent {
	"""
	Time-ordered (UUID v7): the log's sequence as well as
	its id.
	"""
	id: ID!
	"""
	What happened.
	"""
	kind: ProcedureEventKind!
	"""
	Who acted; `null` for a system event — or an account
	since deleted.
	"""
	actor: AccountRef
	"""
	When it happened.
	"""
	createdAt: DateTime!
}

"""
Never published. Its only fact is the row's creation time.
"""
type ProcedureDraftState {
	createdAt: DateTime!
}

"""
One entry in a procedure's audit trail (G.11.2): the G.9 row as
the shared shape, one member per kind — facts live where they are
meaningful, so only the published event carries any.
"""
interface ProcedureEvent {
	"""
	Time-ordered (UUID v7): the log's sequence as well as its id.
	"""
	id: ID!
	"""
	What happened.
	"""
	kind: ProcedureEventKind!
	"""
	Who acted; `null` for a system event — or an account since deleted.
	"""
	actor: AccountRef
	"""
	When it happened.
	"""
	createdAt: DateTime!
}

"""
The event alphabet (platform P.4), generated from the
platform-core enum.
"""
enum ProcedureEventKind {
	CREATED
	PUBLISHED
	CLOSED
	REOPENED
}

type ProcedurePublishedEvent implements ProcedureEvent {
	"""
	Time-ordered (UUID v7): the log's sequence as well as its id.
	"""
	id: ID!
	"""
	What happened.
	"""
	kind: ProcedureEventKind!
	"""
	Who acted; `null` for a system event — or an account since
	deleted.
	"""
	actor: AccountRef
	"""
	When it happened.
	"""
	createdAt: DateTime!
	"""
	The publication's content address (§2.13 decision 9).
	"""
	publication: ID!
	"""
	The fork point this publication was authored against; `null`
	on a first publication.
	"""
	base: ID
	"""
	The diff this publication made (G.11.4): the exact
	classification `publishRevision` gated on, recomputed at read
	time from the two content-addressed schemas. A `null` base
	classifies against the empty schema — a first publication
	reads as the initial column list, no special case.
	"""
	report: ImpactReport!
}

"""
Open for submissions.
"""
type ProcedurePublishedState {
	"""
	Since when the procedure is open — reset by reopening, so
	deliberately not `publishedAt`; revision publication dates
	live on revisions (platform P.4).
	"""
	since: DateTime!
}

type ProcedureRef {
	id: ID!
	title: String!
	"""
	The bare lifecycle state.
	"""
	state: ProcedureStateValue!
	organization: OrganizationRef!
}

type ProcedureReopenedEvent implements ProcedureEvent {
	"""
	Time-ordered (UUID v7): the log's sequence as well as
	its id.
	"""
	id: ID!
	"""
	What happened.
	"""
	kind: ProcedureEventKind!
	"""
	Who acted; `null` for a system event — or an account
	since deleted.
	"""
	actor: AccountRef
	"""
	When it happened.
	"""
	createdAt: DateTime!
}

"""
The lifecycle state (G.2 rule 5): a union of state-specific
objects, subject-prefixed.
"""
union ProcedureState = ProcedureDraftState | ProcedurePublishedState | ProcedureClosedState

"""
The bare state, for list rows and filters (G.2 rule 5's parallel
enum, generated from the platform-core discriminant).
"""
enum ProcedureStateValue {
	DRAFT
	PUBLISHED
	CLOSED
}

"""
`publishRevision` input.
"""
input PublishRevisionInput {
	"""
	The procedure whose revision draft publishes; the viewer must
	administer it.
	"""
	procedureId: ID!
	"""
	Accept a report worse than `SAFE` (G.10): without it such a
	report is returned with `published: false` and nothing is
	written.
	"""
	confirm: Boolean! = false
}

"""
What `publishRevision` answers (G.10): the report always, the
procedure as it now stands, and whether anything was written.
"""
type PublishRevisionResult {
	"""
	What this publication does (or would do) to records.
	"""
	report: ImpactReport!
	"""
	`false`: the report exceeded `SAFE` without `confirm` — the
	procedure is untouched; re-send with `confirm: true`.
	"""
	published: Boolean!
	"""
	The procedure, published or untouched.
	"""
	procedure: Procedure!
}

type Query {
	"""
	The authenticated account the request executes as.
	"""
	viewer: Viewer!
	"""
	An organization the viewer is a member of; `null` otherwise.
	"""
	organization(id: ID!): Organization
	"""
	The organizations the viewer is a member of, oldest first.
	"""
	organizations: [OrganizationRef!]!
	"""
	A team of an organization the viewer is a member of, or a team
	the viewer reviews for; `null` otherwise.
	"""
	team(id: ID!): Team
	"""
	A procedure owned by an organization the viewer is a member
	of; `null` otherwise.
	"""
	procedure(id: ID!): Procedure
	"""
	A case file the viewer participates in, or one on a procedure
	the viewer administers; `null` otherwise (G.13).
	"""
	caseFile(id: ID!): CaseFile
	"""
	The case files the viewer can see — today, those the viewer
	participates in (G.13, viewer-scoped) — newest first,
	forward-only.
	"""
	caseFiles(first: Int, after: String): CaseFileConnection!
	"""
	Every procedure the viewer administers — those owned by the
	viewer's organizations — oldest first.
	"""
	procedures: [ProcedureRef!]!
}

