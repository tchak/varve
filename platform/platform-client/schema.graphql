	text: TextTypeInput
	boolean: Boolean
	integer: NumberTypeInput
	decimal: NumberTypeInput
	date: Boolean
	datetime: Boolean
	enum: EnumTypeInput
	attachment: AttachmentTypeInput
	geometry: GeometryTypeInput
}

"""
The type constructors, carried by every output union member as
