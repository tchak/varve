	The procedure whose revision draft is edited; the viewer must
	administer it.
	"""
	procedureId: ID!
	"""
	Where the column goes; omitted = appended at the root.
	"""
	placement: PlacementInput! = {parentId: null, beforeId: null}
	label: String!
	type: ColumnTypeInput!
	arity: Arity! = ONE
}

"""
`addGroup` input.
