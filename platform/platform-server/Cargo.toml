[package]
name = "platform-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The binary: the topcoat router (app + `/graphql` and
# upload/download `#[route]` handlers) + the `platform-jobs` runners
# (design/platform.md P.3). One process to start with; the seams are already
# crates.
[dependencies]
base64 = "0.22"
dotenvy = "0.15.7"
platform-app = { version = "0.1.0", path = "../platform-app" }
platform-core = { version = "0.1.0", path = "../platform-core" }
platform-store = { version = "0.1.0", path = "../platform-store" }
thiserror.workspace = true
toasty = "0.10.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
topcoat = "0.7.0"
