[package]
name = "platform-graphql"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The public GraphQL schema and its resolvers, executed in-process
# over a `Principal` (design/platform.md P.3, P.5). Knows nothing of
# sessions or tokens: the transport (`platform-app`'s `/graphql`
# route) resolves the principal and hands it in as request data.
[dependencies]
async-graphql = { version = "8.0.0-rc.5", features = ["uuid", "jiff"] }
jiff = "0.2"
# The client is a leaf; this crate provides its in-process transport.
platform-client = { version = "0.1.0", path = "../platform-client" }
platform-core = { version = "0.1.0", path = "../platform-core" }
# The revision draft is a kernel `Schema`; its GraphQL shape is a
# flattening of the kernel types (G.6, revision-draft slice).
varve-core = { path = "../../crates/varve-core" }
varve-impact = { path = "../../crates/varve-impact" }
varve-schema = { path = "../../crates/varve-schema" }
varve-surface = { path = "../../crates/varve-surface" }
# `publishRevision` is the composition point (P.4 *Publication*): the
# mutation opens the transaction, scopes the kernel store over it,
# and calls the platform-core use case.
platform-store = { version = "0.1.0", path = "../platform-store" }
# The shared-executor mutex of that composition.
tokio = { version = "1", features = ["sync"] }
# Only for the `toasty::Db` handle resolvers receive; the driver and
# model features are `platform-core`'s business.
serde_json = "1"
toasty = "0.10.0"
tracing = "0.1"
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# v4 only for minting unique test fixtures.
uuid = { version = "1", features = ["v4"] }
cynic = "3.14"
