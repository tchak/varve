[package]
name = "platform-graphql"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The public GraphQL schema and its resolvers, executed in-process
# over a `Principal` (PLATFORM.md P.3, P.5). Knows nothing of
# sessions or tokens: the transport (`platform-app`'s `/graphql`
# route) resolves the principal and hands it in as request data.
[dependencies]
async-graphql = { version = "8.0.0-rc.5", features = ["uuid"] }
platform-core = { version = "0.1.0", path = "../platform-core" }
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
