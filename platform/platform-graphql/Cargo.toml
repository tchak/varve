[package]
name = "platform-graphql"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The public GraphQL schema and its resolvers, executed in-process
# over a `Principal` (design/platform.md P.3, P.5). Knows nothing of
# sessions or tokens: the transport (`platform-app`'s `/graphql`
# route) resolves the principal and hands it in as request data.
[dependencies]
async-graphql = { version = "8.0.0-rc.5", features = ["uuid", "jiff"] }
jiff = "0.2"
tracing = "0.1"
platform-core = { version = "0.1.0", path = "../platform-core" }
toasty = { version = "0.10.0", features = ["postgresql", "jiff"] }
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
# v4 only for minting unique test fixtures.
uuid = { version = "1", features = ["v4"] }
