[package]
name = "platform-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# Toasty models for platform-owned data (accounts, procedure
# catalog, team membership, messages, API tokens, webhook subscriptions,
# notification outbox) and the use-case services: each use case composes
# one `varve-service` operation with its platform side effects in exactly
# one place (design/platform.md P.3).
[dependencies]
anyhow = { version = "1", optional = true }
argon2 = { version = "0.5.3", features = ["std"] }
# `api_token`: the secret (OS randomness, URL-safe base64) and its stored hash.
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
jiff = "0.2"
thiserror.workspace = true
toasty = { version = "0.10.0", features = ["postgresql", "jiff", "migration"] }
toasty-cli = { version = "0.10.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
# `procedure`: draft column ids are minted here (v4 — no ordering to preserve).
uuid = { version = "1", features = ["v4"] }
# The kernel edge (P.4 procedure drafts): the draft *is* a kernel
# `Schema`, edited in memory and parked as its wire-canonical bytes.
varve-core = { path = "../../crates/varve-core" }
varve-schema = { path = "../../crates/varve-schema" }
varve-wire = { path = "../../crates/varve-wire" }

[dev-dependencies]
varve-schema = { path = "../../crates/varve-schema" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[features]
# The project-local migration CLI (toasty has no standalone binary: the
# CLI must link the model types to diff the schema). Not part of the
# library API; platform-server may later host its own bin on top.
migrate-cli = ["dep:toasty-cli", "dep:anyhow", "tokio"]

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"
required-features = ["migrate-cli"]
