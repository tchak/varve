[package]
name = "platform-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# Toasty models for platform-owned data (accounts, procedure
# catalog, team membership, messages, API tokens, webhook subscriptions,
# notification outbox) and the use-case services: each use case composes
# one `varve-service` operation with its platform side effects in exactly
# one place (design/platform.md P.3).
[dependencies]
anyhow = { version = "1", optional = true }
argon2 = { version = "0.5.3", features = ["std"] }
# `api_token`: the secret (OS randomness, URL-safe base64) and its stored hash.
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
jiff = "0.2"
thiserror.workspace = true
# `publish`: the shared-executor mutex (P.3 transaction shape); the
# migrate-cli feature adds the runtime.
tokio = { version = "1", features = ["sync"] }
toasty = { version = "0.10.0", features = ["postgresql", "jiff", "migration"] }
toasty-cli = { version = "0.10.0", optional = true }
# `procedure`: draft element ids are minted here (v4 — no ordering to preserve).
uuid = { version = "1", features = ["v4"] }
# `tree`: the authored tree is stored as platform-owned JSON (P.4) —
# it carries audiences and presentation nodes no kernel object holds.
serde_json = "1"
# The kernel edge (P.4 procedure drafts): the authored tree derives
# the kernel `Schema`, validated by the kernel on every edit.
varve-core = { path = "../../crates/varve-core" }
varve-schema = { path = "../../crates/varve-schema" }
# `surfaces`: compiled rules are varve-logic exprs (the vacuous
# always-required rule).
varve-logic = { path = "../../crates/varve-logic" }
# `publish`: the use case composes the varve-service operation with
# its platform side effects (P.3) — generic over the store traits.
varve-service = { path = "../../crates/varve-service" }
varve-store = { path = "../../crates/varve-store" }
varve-impact = { path = "../../crates/varve-impact" }
# `tree`: format constraints are surface admissibility over text
# (DESIGN §2.6) — the authored tree stores the kernel's `Format`.
varve-surface = { path = "../../crates/varve-surface" }

[dev-dependencies]
varve-schema = { path = "../../crates/varve-schema" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[features]
# The project-local migration CLI (toasty has no standalone binary: the
# CLI must link the model types to diff the schema). Not part of the
# library API; platform-server may later host its own bin on top.
migrate-cli = ["dep:toasty-cli", "dep:anyhow", "tokio/rt-multi-thread", "tokio/macros"]

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"
required-features = ["migrate-cli"]
