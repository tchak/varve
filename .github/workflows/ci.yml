name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    # Platform DB tests gate on VARVE_TEST_DATABASE_URL (PLATFORM.md
    # P.3): without it they pass vacuously, so local `cargo test
    # --workspace` needs no database — CI provides one so they run
    # for real here.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: varve
          POSTGRES_PASSWORD: varve
          POSTGRES_DB: varve_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U varve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VARVE_TEST_DATABASE_URL: postgres://varve:varve@localhost:5432/varve_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  lint:
    name: fmt, clippy, doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo doc --workspace --no-deps --locked

  layering:
    # DESIGN.md §13.5: no runtime / ORM / web / storage crate in the
    # dependency closure of any Tier 0–4 crate; serde only where §9 allows.
    name: layering guard (§13.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/check-layering.sh

  fuzz-regression:
    # Every tracked seed (fuzz/seeds/<target>/ — the minimized corpora)
    # still runs clean: -runs=0 executes each input once and exits.
    # Extended fuzzing and seed growth live in fuzz.yml.
    name: fuzz regression (seeds)
    runs-on: ubuntu-latest
    env:
      # Nightly-only lints must not break the fuzz build.
      RUSTFLAGS: ""
      # install-action ships a musl-built cargo-fuzz, whose default
      # target is its own build triple; ASan needs the gnu one.
      CARGO_FUZZ_TARGET: --target x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: build fuzz targets
        working-directory: fuzz
        run: cargo fuzz build $CARGO_FUZZ_TARGET
      - name: run seeds
        working-directory: fuzz
        run: |
          for target in $(cargo fuzz list); do
            echo "::group::$target ($(ls "seeds/$target" | wc -l) seeds)"
            cargo fuzz run $CARGO_FUZZ_TARGET "$target" "seeds/$target" -- -runs=0
            echo "::endgroup::"
          done
