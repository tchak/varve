name: Coverage

# Runs on main only: the instrumented build cannot share ci.yml's
# cache (different RUSTFLAGS) and the repo sits at GitHub's 10 GB
# cache limit, so this job builds uncached — too slow to gate PRs,
# fine as a per-commit trend line on Codecov.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Coverage mapping lives in its own section; debuginfo only slows
  # the ~50 test-binary links (same reasoning as ci.yml).
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    # Same database as ci.yml so the DB-gated platform tests count
    # toward coverage instead of passing vacuously.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: varve
          POSTGRES_PASSWORD: varve
          POSTGRES_DB: varve_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U varve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VARVE_TEST_DATABASE_URL: postgres://varve:varve@localhost:5432/varve_platform_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # Browser e2e is excluded: it proves browser semantics, not code
      # breadth, and skipping it means no Playwright install here.
      # Doctests are documentation, not coverage (and need nightly).
      - run: >-
          cargo llvm-cov nextest --workspace --locked
          -E 'not binary(e2e)'
          --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
