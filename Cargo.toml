[workspace]
members = [
    "crates/varve-core",
    "crates/varve-schema",
    "crates/varve-value",
    "crates/varve-record",
    "crates/varve-projection",
    "crates/varve-impact",
    "tools/m0",
]
resolver = "3"

[workspace.dependencies]
proptest = "1"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Nothing publishes before M3 (§9 guardrail). Enforced here.
publish = false
