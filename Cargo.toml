[workspace]
members = [
    "crates/varve-core",
    "crates/varve-schema",
    "crates/varve-value",
    "crates/varve-record",
    "crates/varve-logic",
    "crates/varve-surface",
    "crates/varve-revision",
    "crates/varve-wire",
    "crates/varve-store",
    "crates/varve-files",
    "crates/varve-bundle",
    "crates/varve-projection",
    "crates/varve-impact",
    "tools/m0",
    "platform/platform-core",
    "platform/platform-i18n",
    "platform/platform-app",
    "platform/platform-server",
]
resolver = "3"
# cargo-fuzz targets build on nightly with their own profile; see fuzz/.
exclude = ["fuzz"]

[workspace.dependencies]
proptest = "1"
thiserror = "2"
regex = "1"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Nothing publishes before M3 (§9 guardrail). Enforced here.
publish = false
