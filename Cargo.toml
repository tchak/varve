[workspace]
members = [
    "crates/strata-core",
    "crates/strata-schema",
    "crates/strata-value",
    "crates/strata-record",
    "crates/strata-projection",
    "tools/m0",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Q1: the "strata" name is taken on crates.io, and the guardrail says
# nothing publishes before M3. Enforced here.
publish = false
